<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#23261a" />
      <stop offset="100%" stopColor="#0a0b08" />
    </linearGradient>
    <linearGradient id="oliveGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f2f4e8" />
      <stop offset="45%" stopColor="#a8ad7a" />
      <stop offset="100%" stopColor="#545a34" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a8ad7a" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#33361f" stopOpacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Outer Dotted Reticle -->
  <circle cx="32" cy="32" r="24" stroke="#a8ad7a" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.4" />

  <!-- Central Centered Lightning Task Emblem -->
  <path d="M35 10L19 33H32L29 54L45 31H32L35 10Z" fill="url(#oliveGrad)" stroke="#0b0c0a" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)" />
</svg>
