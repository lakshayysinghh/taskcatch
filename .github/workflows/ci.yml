name: CI

# Runs on every branch push and pull request. Releases are built separately
# by release.yml when a version tag is pushed.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # Deadlines are computed in local time; make sure that holds across offsets.
      - name: Tests in other timezones
        run: |
          TZ=Asia/Kolkata npm test
          TZ=America/New_York npm test
          TZ=Pacific/Chatham npm test

  rust:
    name: Rust build & tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds dist/ at compile time, so build the frontend first.
      - run: npm ci
      - run: npm run build

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
